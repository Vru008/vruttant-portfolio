name: Refresh GitHub stats

# Daily: regenerate public/data/github.json and commit it if anything changed.
# The push triggers a Vercel redeploy, so the live site stays current.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_github.py --user Vru008
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          # generatedAt changes every run, so only commit when the real stats moved.
          if git diff --quiet -I '"generatedAt"' -- public/data/github.json; then
            echo "Stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/github.json
          git commit -m "Refresh GitHub stats"
          git push
